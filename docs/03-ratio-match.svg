<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="Six master pages sorted from tall to wide; an Excel row with ratio 1.91 selects the page with ratio 1.78">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c8502a"/></marker>
  </defs>
  <style>text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f1d1a}.t{font-size:14px;font-weight:700}.s{font-size:13px;fill:#5b564e}.r{font-size:14px;font-weight:700}</style>
  <rect width="900" height="320" rx="12" fill="#f6f1e7"/>

  <text x="40" y="42" class="t">Pages of the master, sorted from tall to wide</text>

  <rect x="470" y="56" width="270" height="44" rx="6" fill="#fff" stroke="#c8502a" stroke-width="2.5"/>
  <text x="605" y="84" text-anchor="middle" class="t">Excel row: 1200 × 628  →  ratio 1.91</text>
  <path d="M600 100L600 148" stroke="#c8502a" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <g fill="#fff" stroke="#1f1d1a" stroke-width="2">
    <rect x="40" y="110" width="67" height="120"/>
    <rect x="137" y="110" width="85" height="120"/>
    <rect x="252" y="130" width="100" height="100"/>
    <rect x="382" y="145" width="120" height="85"/>
    <rect x="697" y="175" width="165" height="55"/>
  </g>
  <rect x="532" y="154" width="135" height="76" fill="#f3d2c4" stroke="#c8502a" stroke-width="3.5"/>
  <text x="600" y="198" text-anchor="middle" class="t" style="fill:#8f3417">closest</text>

  <g text-anchor="middle" class="r">
    <text x="73" y="254">0.56</text>
    <text x="179" y="254">0.71</text>
    <text x="302" y="254">1.00</text>
    <text x="442" y="254">1.41</text>
    <text x="600" y="254" style="fill:#8f3417">1.78</text>
    <text x="779" y="254">3.00</text>
  </g>

  <text x="40" y="292" class="s">Ratio = width ÷ height. The script keeps the closest page and removes the others from the working copy.</text>
</svg>
