<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Excel list and master documents go into the script, which produces one finished InDesign file per row, or an error report">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f1d1a"/></marker>
  </defs>
  <style>text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f1d1a}.t{font-size:15px;font-weight:700}.s{font-size:13px;fill:#5b564e}.w{fill:#fff}.ws{fill:#e8dcc4;font-size:13px}</style>
  <rect width="900" height="300" rx="12" fill="#f6f1e7"/>

  <rect x="40" y="50" width="230" height="80" rx="6" fill="#fff" stroke="#1f1d1a" stroke-width="2"/>
  <text x="56" y="84" class="t">Excel list (.xlsx)</text>
  <text x="56" y="106" class="s">one row = one format to produce</text>

  <rect x="40" y="170" width="230" height="80" rx="6" fill="#fff" stroke="#1f1d1a" stroke-width="2"/>
  <text x="56" y="204" class="t">Master documents (.indd)</text>
  <text x="56" y="226" class="s">one page per aspect ratio</text>

  <rect x="350" y="95" width="200" height="110" rx="6" fill="#1f1d1a"/>
  <text x="450" y="143" text-anchor="middle" class="t w" style="font-size:19px">The script</text>
  <text x="450" y="168" text-anchor="middle" class="ws">runs inside InDesign</text>

  <rect x="630" y="50" width="230" height="80" rx="6" fill="#fff" stroke="#c8502a" stroke-width="2.5"/>
  <text x="646" y="84" class="t">_result folder</text>
  <text x="646" y="106" class="s">one finished .indd per Excel row</text>

  <rect x="630" y="170" width="230" height="80" rx="6" fill="#fff" stroke="#1f1d1a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="646" y="204" class="t">Error report (.txt)</text>
  <text x="646" y="226" class="s">only when the input is wrong</text>

  <g stroke="#1f1d1a" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M270 90L346 128"/>
    <path d="M270 210L346 172"/>
    <path d="M550 128L626 90"/>
    <path d="M550 172L626 210" stroke-dasharray="6 5"/>
  </g>
</svg>
