<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" role="img" aria-label="A page with eight labelled elements and the rule each one follows when the page changes size">
  <style>text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f1d1a}.t{font-size:14.5px;font-weight:700}.s{font-size:13px;fill:#5b564e}.n{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle}</style>
  <rect width="900" height="530" rx="12" fill="#f6f1e7"/>

  <!-- background, to bleed -->
  <rect x="40" y="40" width="400" height="440" fill="#e9dcc3"/>
  <!-- key image -->
  <circle cx="240" cy="285" r="58" fill="#2b4c8c"/>
  <!-- headline -->
  <rect x="150" y="165" width="180" height="18" fill="#1f1d1a"/>
  <rect x="180" y="192" width="120" height="10" fill="#1f1d1a"/>
  <!-- badge -->
  <rect x="82" y="82" width="62" height="26" fill="#c8502a"/>
  <text x="113" y="100" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#fff">NEW</text>
  <!-- logo + clear space -->
  <rect x="329" y="82" width="69" height="38" fill="none" stroke="#1f1d1a" stroke-width="1.2" stroke-dasharray="3 3"/>
  <rect x="338.500" y="91.500" width="50" height="19" fill="#c8502a"/>
  <!-- item above bands -->
  <rect x="92" y="360" width="96" height="26" fill="#d9a441"/>
  <!-- second band 5% -->
  <rect x="40" y="386" width="400" height="16" fill="#7a746a"/>
  <!-- legal band 10% -->
  <rect x="40" y="402" width="400" height="78" fill="#1f1d1a"/>
  <text x="240" y="425" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#fff;letter-spacing:1.5px">LEGAL TEXT</text>

  <!-- page edge, bleed, visible -->
  <rect x="52" y="52" width="376" height="416" fill="none" stroke="#1f1d1a" stroke-width="2"/>
  <rect x="40" y="40" width="400" height="440" fill="none" stroke="#1f1d1a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="82" y="82" width="316" height="356" fill="none" stroke="#d6007f" stroke-width="2.5"/>

  <!-- markers on drawing -->
  <g>
    <circle cx="67" cy="250" r="11" fill="#1f1d1a" stroke="#fff" stroke-width="1.5"/><text x="67" y="254" class="n">1</text>
    <circle cx="160" cy="95" r="11" fill="#1f1d1a" stroke="#fff" stroke-width="1.5"/><text x="160" y="99" class="n">2</text>
    <circle cx="346" cy="174" r="11" fill="#1f1d1a" stroke="#fff" stroke-width="1.5"/><text x="346" y="178" class="n">3</text>
    <circle cx="312" cy="101" r="11" fill="#1f1d1a" stroke="#fff" stroke-width="1.5"/><text x="312" y="105" class="n">4</text>
    <circle cx="240" cy="285" r="11" fill="#1f1d1a" stroke="#fff" stroke-width="1.5"/><text x="240" y="289" class="n">5</text>
    <circle cx="204" cy="373" r="11" fill="#1f1d1a" stroke="#fff" stroke-width="1.5"/><text x="204" y="377" class="n">6</text>
    <circle cx="456" cy="394" r="11" fill="#1f1d1a" stroke="#fff" stroke-width="1.5"/><text x="456" y="398" class="n">7</text>
    <circle cx="456" cy="446" r="11" fill="#1f1d1a" stroke="#fff" stroke-width="1.5"/><text x="456" y="450" class="n">8</text>
  </g>

  <!-- legend under drawing -->
  <g class="s" style="font-size:12px">
    <rect x="40" y="503" width="14" height="3" fill="#d6007f"/><text x="60" y="509">visible area</text>
    <path d="M150 505L172 505" stroke="#1f1d1a" stroke-width="2"/><text x="178" y="509">page edge</text>
    <path d="M262 505L284 505" stroke="#1f1d1a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="290" y="509">bleed</text>
  </g>

  <!-- rules list -->
  <g>
    <circle cx="505" cy="58" r="11" fill="#1f1d1a"/><text x="505" y="62" class="n">1</text>
    <text x="526" y="56" class="t">Background</text>
    <text x="526" y="75" class="s">stretched to the bleed on all four sides</text>

    <circle cx="505" cy="114" r="11" fill="#1f1d1a"/><text x="505" y="118" class="n">2</text>
    <text x="526" y="112" class="t">Corner badge</text>
    <text x="526" y="131" class="s">pinned to a corner of the visible area</text>

    <circle cx="505" cy="170" r="11" fill="#1f1d1a"/><text x="505" y="174" class="n">3</text>
    <text x="526" y="168" class="t">Headline</text>
    <text x="526" y="187" class="s">centred in the visible area</text>

    <circle cx="505" cy="226" r="11" fill="#1f1d1a"/><text x="505" y="230" class="n">4</text>
    <text x="526" y="224" class="t">Logo</text>
    <text x="526" y="243" class="s">height = 4% of the visible diagonal, clear space =</text>
    <text x="526" y="260" class="s">half its height, guides drawn around the zone</text>

    <circle cx="505" cy="299" r="11" fill="#1f1d1a"/><text x="505" y="303" class="n">5</text>
    <text x="526" y="297" class="t">Key image</text>
    <text x="526" y="316" class="s">rescaled from the new format size, then centred</text>

    <circle cx="505" cy="355" r="11" fill="#1f1d1a"/><text x="505" y="359" class="n">6</text>
    <text x="526" y="353" class="t">Item above the bands</text>
    <text x="526" y="372" class="s">always sits right on top of the bands</text>

    <circle cx="505" cy="411" r="11" fill="#1f1d1a"/><text x="505" y="415" class="n">7</text>
    <text x="526" y="409" class="t">Second band</text>
    <text x="526" y="428" class="s">5% of the height left above the legal band</text>

    <circle cx="505" cy="467" r="11" fill="#1f1d1a"/><text x="505" y="471" class="n">8</text>
    <text x="526" y="465" class="t">Legal band</text>
    <text x="526" y="484" class="s">10% of the visible height, content re-centred,</text>
    <text x="526" y="501" class="s">extended into the bleed</text>
  </g>
</svg>
